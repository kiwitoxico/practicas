<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel - Práctica</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body class="auth-mode">

    <!-- ==================== LOGIN ==================== -->
    <div id="login-section" class="auth-container">
        <h2>Iniciar Sesión</h2>
        <p>Accede a tu panel de control</p>
        
        <form id="login-form">
            <input type="email" id="email" placeholder="Correo electrónico" value="kiwi@gmail.com" required>
            <input type="password" id="password" placeholder="Contraseña" value="123456" required>
            
            <div id="login-error" style="color: #ef4444; font-size: 0.9rem; margin-top: 0.5rem; display: none;"></div>
            
            <button type="submit">Siguiente</button>
        </form>
    </div>

    <!-- ==================== 2FA ==================== -->
    <div id="2fa-section" class="auth-container" style="display: none;">
        <h2>Verificación de Seguridad</h2>
        <p>Introduce el código de 6 dígitos de tu app Google Authenticator.</p>
        
        <div id="qr-setup" style="display: none;">
            <p>Escanea este código QR con tu aplicación:</p>
            <div id="qrcode"></div>
        </div>

        <form id="2fa-form">
            <input type="text" id="2fa-code" placeholder="000000" maxlength="6" pattern="\d{6}" required>
            <button type="submit">Verificar e Ingresar</button>
        </form>
    </div>

    <!-- ==================== DASHBOARD ==================== -->
    <div id="dashboard-section" style="display: none;">
        <aside class="sidebar">
            <h2>Panel de Control</h2>
            <ul class="sidebar-menu">
                <li><button class="menu-btn active" data-section="inicio">Inicio</button></li>
                <li><button class="menu-btn" data-section="articulos">Proyectos</button></li>
                <li><button id="logout-btn" class="menu-btn logout-btn">Cerrar Sesión</button></li>
                <li><button class="menu-btn" data-section="0">enconstruccion</button></li>
                <li><button class="menu-btn" data-section="0">enconstruccion</button></li>
            </ul>
        </aside>

        <main class="main-content">
            <h1>Artículos y Proyectos</h1>
            <div id="contenedor_tarjetas"></div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        // ==================== CONFIGURACIÓN ====================
        const API_URL = 'http://143.47.60.81:3000/api';
        const DURACION_SESION = 10 * 60 * 1000; // 10 minutos

        // ==================== LOGIN ====================
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('login-error');
            errorDiv.style.display = 'none';

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (data.success) {
                    document.getElementById('login-section').style.display = 'none';
                    document.getElementById('2fa-section').style.display = 'block';

                    if (!data.mfaConfigurado) {
                        cargarQR(email);
                    } else {
                        document.getElementById('qr-setup').style.display = 'none';
                    }
                } else {
                    errorDiv.textContent = data.message || "Correo o contraseña incorrectos";
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = "Error de conexión con el servidor";
                errorDiv.style.display = 'block';
            }
        });

        // ==================== CARGAR QR ====================
        async function cargarQR(email) {
            const qrContainer = document.getElementById('qr-setup');
            const qrDiv = document.getElementById('qrcode');

            qrContainer.style.display = 'block';
            qrDiv.innerHTML = '<p style="color:#94a3b8;">Generando código QR...</p>';

            try {
                // Enviamos el email como parámetro
                const res = await fetch(`${API_URL}/setup-2fa?email=${encodeURIComponent(email)}`);
                const data = await res.json();

                qrDiv.innerHTML = '';

                if (data.alreadyConfigured) {
                    // El usuario ya tiene 2FA configurado
                    qrContainer.style.display = 'none';
                    alert("Este usuario ya tiene 2FA configurado.");
                    return;
                }

                if (data.qrCodeDataUrl) {
                    const img = document.createElement('img');
                    img.src = data.qrCodeDataUrl;
                    img.style.maxWidth = '200px';
                    qrDiv.appendChild(img);
                } else {
                    qrDiv.innerHTML = '<p style="color:#ef4444;">No se pudo generar el QR.</p>';
                }

            } catch (error) {
                console.error(error);
                qrDiv.innerHTML = `<p style="color:#ef4444;">Error al conectar con el servidor para generar el QR.</p>`;
            }
        }

        // ==================== VERIFICAR CÓDIGO 2FA ====================
        document.getElementById('2fa-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const codigo = document.getElementById('2fa-code').value.trim();
            const email = document.getElementById('email').value.trim(); // ← Obtenemos el email

            if (codigo.length !== 6) {
                alert("Introduce un código de 6 dígitos válido.");
                return;
            }

            try {
                const res = await fetch(`${API_URL}/verify-2fa`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: email,      // ← Enviamos el email
                        token: codigo
                    })
                });

                const data = await res.json();

                if (data.success) {
                    onLoginExitoso();
                } else {
                    alert(data.message || "Código incorrecto");
                }

            } catch (error) {
                console.error(error);
                alert("Error al verificar el código");
            }
        });

        // ==================== AL LOGUEARSE CORRECTAMENTE ====================
        function onLoginExitoso(rol = 0) {   // rol = 0 → Admin, rol = 1 → Técnico
        const expiracion = Date.now() + DURACION_SESION;
        localStorage.setItem('sesionExpiracion', expiracion);
        localStorage.setItem('usuarioLogueado', 'true');
        localStorage.setItem('userRol', rol);           // ← Guardamos el rol

        document.getElementById('2fa-section').style.display = 'none';
        document.getElementById('dashboard-section').style.display = 'flex';
        document.body.classList.add('dashboard-mode');

        configurarMenuPorRol(rol);     // ← Configuramos el menú según rol
        cargarSeccionPorDefecto(rol);  // ← Cargamos la sección inicial
    }
        function configurarMenuPorRol(rol) {
            const menuItems = document.querySelectorAll('.menu-btn');

            menuItems.forEach(button => {
                const section = button.getAttribute('data-section');

                if (rol === 1) { // Técnico
                    // Ocultamos "Inicio" para técnicos
                    if (section === 'inicio') {
                        button.style.display = 'none';
                    }
                } else {
                    // Administrador ve todo
                    button.style.display = 'flex';
                }
            });
        }
        function cargarSeccionPorDefecto(rol) {
            const contenedor = document.getElementById('contenedor_tarjetas');

            if (rol === 0) {
                // Administrador → va a Inicio por defecto
                document.querySelector('.menu-btn[data-section="inicio"]').classList.add('active');
                contenedor.innerHTML = '<h2>Bienvenido al Panel de Administración</h2>';
            } else {
                // Técnico → va directamente a Proyectos
                document.querySelector('.menu-btn[data-section="articulos"]').classList.add('active');
                cargarDatos(); // Carga los proyectos
            }
        }

        // ==================== VERIFICAR SESIÓN AL CARGAR ====================
        function verificarSesion() {
            const expiracion = localStorage.getItem('sesionExpiracion');
            const logueado = localStorage.getItem('usuarioLogueado');

            if (expiracion && logueado && Date.now() < parseInt(expiracion)) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('2fa-section').style.display = 'none';
                document.getElementById('dashboard-section').style.display = 'flex';
                document.body.classList.add('dashboard-mode');
                cargarDatos();
                return true;
            }
            return false;
        }

        // ==================== CERRAR SESIÓN ====================
        function cerrarSesion() {
            localStorage.removeItem('sesionExpiracion');
            localStorage.removeItem('usuarioLogueado');
            location.reload();
        }

// ==================== CARGAR PROYECTOS ====================
async function cargarDatos() {
    const contenedor = document.getElementById('contenedor_tarjetas');
    contenedor.innerHTML = '<p style="color:#64748b;">Cargando proyectos...</p>';

    try {
        const respuesta = await fetch(`${API_URL}/proyectos`);

        if (!respuesta.ok) {
            throw new Error(`Error HTTP: ${respuesta.status}`);
        }

        const proyectos = await respuesta.json();
        contenedor.innerHTML = '';

        if (proyectos.length === 0) {
            contenedor.innerHTML = '<p>No hay proyectos para mostrar.</p>';
            return;
        }

        proyectos.forEach(proyecto => {
            const tarjeta = crearTarjeta(proyecto);
            contenedor.appendChild(tarjeta);
        });

    } catch (error) {
        console.error("Error al cargar proyectos:", error);
        
        contenedor.innerHTML = `
            <div style="background:#fee2e2; color:#b91c1c; padding:1.2rem; border-radius:8px;">
                <strong>No se pudieron cargar los proyectos</strong><br><br>
                <small>
                    Revisa la consola del navegador (F12) para ver el error exacto.<br>
                    Asegúrate de que el endpoint <code>/api/proyectos</code> esté devolviendo los datos correctamente.
                </small>
            </div>
        `;
    }
}
        function crearTarjeta(proyecto) {
            const div = document.createElement('div');
            div.className = 'tarjeta';

            let estadoClase = '';
            switch (proyecto.estado.toLowerCase()) {
                case 'publicado': estadoClase = 'estado-publicado'; break;
                case 'en progreso': estadoClase = 'estado-en-progreso'; break;
                case 'en revisión': estadoClase = 'estado-en-revision'; break;
                case 'borrado': estadoClase = 'estado-borrado'; break;
            }

            div.innerHTML = `
                <h3>${proyecto.titulo}</h3>
                <p class="descripcion">${proyecto.descripcion}</p>
                <div class="meta">
                    <span>👤 ${proyecto.autor}</span>
                    <span>📅 ${proyecto.fechaCreacion}</span>
                    <span>🏷️ ${proyecto.categoria}</span>
                    <span>👁️ ${proyecto.vistas.toLocaleString()} vistas</span>
                </div>
                <span class="estado ${estadoClase}">${proyecto.estado}</span>
            `;
            return div;
        }

        // ==================== MENÚ LATERAL ====================
        document.querySelectorAll('.menu-btn').forEach(button => {
            button.addEventListener('click', () => {
                document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');

                const section = button.getAttribute('data-section');
                const contenedor = document.getElementById('contenedor_tarjetas');

                if (section === 'articulos') {
                    cargarDatos();
                } else if (section === 'inicio') {
                    contenedor.innerHTML = '<h2>Bienvenido al Panel</h2>';
                } else {
                    contenedor.innerHTML = `<h2>${section.charAt(0).toUpperCase() + section.slice(1)} (próximamente)</h2>`;
                }
            });
        });

        // ==================== INICIALIZACIÓN ====================
        window.onload = function() {
            verificarSesion();
        };
		// Función de cerrar sesión (si no la tienes ya)
		function cerrarSesion() {
			localStorage.removeItem('sesionExpiracion');
			localStorage.removeItem('usuarioLogueado');
			location.reload(); // Recarga la página y vuelve al login
		}
		
		document.getElementById('logout-btn').addEventListener('click', () => {
        if (confirm("¿Estás seguro de que quieres cerrar sesión?")) {
            cerrarSesion();
        }
    });
    </script>
</body>
</html>
